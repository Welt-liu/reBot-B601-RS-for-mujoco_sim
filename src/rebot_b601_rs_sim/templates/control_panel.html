<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B601-RS 控制面板</title>
<style>
  :root {
    --bg: #1a1d23;
    --panel-bg: #23262e;
    --border: #363a44;
    --text: #c8ccd4;
    --accent: #5b9bd5;
    --green: #4caf50;
    --warn: #f0a030;
    --red: #e05555;
    --log-bg: #14161a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; padding: 24px 16px;
    min-height: 100vh;
  }
  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    width: 100%; max-width: 540px;
    display: flex; flex-direction: column;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .header h1 { font-size: 1.15rem; font-weight: 600; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .btn-reconnect {
    background: #3a3d47; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 10px; font-size: 0.72rem; font-weight: 600;
    cursor: pointer; transition: background 0.12s;
  }
  .btn-reconnect:hover { background: var(--accent); color: #fff; }
  .ws-url {
    font-family: "JetBrains Mono","Consolas",monospace;
    font-size: 0.66rem; color: #4a5568;
    margin-bottom: 10px; padding: 4px 8px;
    background: #14161a; border-radius: 4px;
    word-break: break-all;
  }
  .status {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.8rem; font-weight: 500;
  }
  .status .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--warn); transition: background 0.3s;
  }
  .status.connected  .dot { background: var(--green); }
  .status.retrying   .dot { background: var(--warn);  animation: blink 1s infinite; }
  .status.failed     .dot { background: var(--red);   }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .pose-display {
    font-family: "JetBrains Mono", "Consolas", monospace;
    font-size: 0.82rem; color: #8a8f98;
    margin-bottom: 20px; padding: 8px 12px;
    background: #1a1d23; border-radius: 6px;
  }
  .slider-group { margin-bottom: 14px; }
  .slider-group .label-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 4px;
  }
  .slider-group label {
    font-size: 0.85rem; font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.04em; color: #9aa0ab;
  }
  .slider-group .val {
    font-family: "JetBrains Mono", "Consolas", monospace;
    font-size: 0.82rem; color: var(--accent);
    min-width: 64px; text-align: right;
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: 3px;
    background: #2e323b; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: none;
  }
  /* 可达性预校验配色 */
  input[type="range"].fail::-webkit-slider-thumb {
    background: var(--red);
    box-shadow: 0 0 8px 1px rgba(224,85,85,0.5);
  }
  input[type="range"].warn::-webkit-slider-thumb {
    background: var(--warn);
    box-shadow: 0 0 8px 1px rgba(240,160,48,0.45);
  }
  input[type="range"].ok::-webkit-slider-thumb { background: var(--accent); }
  .reach-status {
    font-family: "JetBrains Mono","Consolas",monospace;
    font-size: 0.72rem; color: #8a8f98;
    margin: -2px 0 10px; padding: 6px 10px;
    background: #1a1d23; border-radius: 4px;
    display: flex; justify-content: space-between; align-items: center;
    border-left: 3px solid var(--accent);
    transition: border-color 0.15s, background 0.15s;
  }
  .reach-status.warn { border-left-color: var(--warn); color: var(--warn); }
  .reach-status.fail { border-left-color: var(--red);   color: var(--red); }
  .reach-status .reach-msg { font-weight: 500; }
  .reach-status .reach-r   { opacity: 0.75; }
  .section-label {
    font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: #636873;
    margin: 18px 0 6px; padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .button-row {
    display: flex; gap: 10px; margin-top: 20px;
  }
  button {
    flex: 1; padding: 10px 0; border: none; border-radius: 6px;
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s;
  }
  button:active { opacity: 0.8; }
  .btn-send { background: var(--accent); color: #fff; }
  .btn-home { background: #3a3d47; color: var(--text); }
  .toggle-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 14px; font-size: 0.8rem; color: #8a8f98;
  }
  .toggle-row input { accent-color: var(--accent); }
  .ik-feedback {
    margin-top: 12px; font-size: 0.78rem; color: #6a6f78;
    min-height: 20px;
  }
  .ik-feedback.ok { color: var(--green); }
  .ik-feedback.fail { color: var(--red); }

  /* ---- 多行日志队列 (最近 6 条) ---- */
  .log-list {
    margin-top: 12px; padding: 8px 10px;
    background: var(--log-bg);
    border: 1px solid var(--border); border-radius: 6px;
    font-family: "JetBrains Mono", "Consolas", monospace;
    font-size: 0.74rem; line-height: 1.45;
    color: #8899aa;
    max-height: 120px; overflow-y: auto;
    display: flex; flex-direction: column-reverse;
  }
  .log-list-item { display: flex; gap: 6px; padding: 1px 0; word-break: break-all; }
  .log-list-item .ts { color: #4a5568; font-size: 0.68rem; flex-shrink: 0; }
  .log-list-item.tag-ok  { color: var(--green); }
  .log-list-item.tag-warn { color: var(--warn); }
  .log-list-item.tag-err { color: var(--red); }
  .log-list-item.tag-home { color: #8899cc; }
  .log-list-item.tag-vel  { color: #88aaff; }

  /* ---- 快捷键 ---- */
  .kbd {
    display: inline-block;
    font-family: "JetBrains Mono", "Consolas", monospace;
    font-size: 0.7rem;
    background: #2a2d36;
    border: 1px solid #444;
    border-radius: 3px;
    padding: 1px 5px;
    margin: 0 2px;
    color: #999;
    vertical-align: middle;
  }
  .slider-group.highlight { background: rgba(91,155,213,0.06); border-radius: 4px; }
  .slider-group.highlight input[type="range"]::-webkit-slider-thumb {
    box-shadow: 0 0 10px 2px var(--accent);
  }
  .help-text {
    margin-top: 14px; font-size: 0.72rem; color: #555; line-height: 1.7;
    border-top: 1px solid var(--border); padding-top: 10px;
  }

  /* ---- 摇杆 ---- */
  .joystick-row {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 16px;
  }
  .joystick-pad {
    width: 130px; height: 130px; flex-shrink: 0;
    border-radius: 50%;
    background: radial-gradient(circle at center, #1e2128 0%, #14161a 100%);
    border: 2px solid #363a44;
    position: relative; cursor: grab;
    touch-action: none;
  }
  .joystick-pad:active, .joystick-pad.active { cursor: grabbing; }
  .joystick-crosshair {
    position: absolute; top: 50%; left: 50%;
    width: 70%; height: 70%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .joystick-crosshair::before, .joystick-crosshair::after {
    content: ''; position: absolute;
    background: #2a2d36;
  }
  .joystick-crosshair::before {
    top: 50%; left: 0; right: 0; height: 1px; transform: translateY(-50%);
  }
  .joystick-crosshair::after {
    left: 50%; top: 0; bottom: 0; width: 1px; transform: translateX(-50%);
  }
  .joystick-knob {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #7ab8e8, #3a6fa0);
    border: 2px solid #5b9bd5;
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none;
    transition: box-shadow 0.12s;
  }
  .joystick-pad.active .joystick-knob {
    box-shadow: 0 0 16px 5px rgba(91,155,213,0.45);
  }
  .joystick-axis-label {
    position: absolute; font-size: 0.6rem; color: #4a4f5a;
    pointer-events: none;
  }
  .joystick-axis-label.x { bottom: 6px; left: 50%; transform: translateX(-50%); }
  .joystick-axis-label.y { right: 6px; top: 50%; transform: translateY(-50%); }
  .joystick-pos {
    font-size: 0.65rem; color: #636873; text-align: center;
    margin-top: 4px; font-family: "JetBrains Mono", "Consolas", monospace;
  }
  /* Z 按钮 */
  .z-controls {
    display: flex; flex-direction: column; gap: 6px; align-items: center;
  }
  .z-btn {
    width: 46px; height: 42px;
    border: 1px solid var(--border); border-radius: 8px;
    background: #23262e; color: var(--text);
    cursor: pointer; font-size: 1.3rem; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    user-select: none; transition: background 0.12s;
  }
  .z-btn:hover { background: #363a44; }
  .z-btn:active { background: var(--accent); color: #fff; }
  .z-label {
    font-size: 0.68rem; color: #636873; font-weight: 500;
  }

  /* ---- 手机姿态按钮 (与摇杆并排,启用后把屏幕朝上姿态映射为末端角速度) ---- */
  .phone-controls {
    display: flex; flex-direction: column; gap: 6px; align-items: center;
    margin-left: auto;
  }
  .phone-btn {
    width: 78px; height: 60px;
    border: 1px solid var(--border); border-radius: 8px;
    background: #23262e; color: var(--text);
    cursor: pointer; line-height: 1.1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    user-select: none;
    transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
    font-weight: 600; font-size: 0.72rem;
    text-align: center;
  }
  .phone-btn:hover { background: #363a44; }
  .phone-btn.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
    box-shadow: 0 0 14px 2px rgba(91,155,213,0.4);
  }
  .phone-btn .icon { font-size: 1.25rem; line-height: 1; }
  .phone-btn.error {
    background: #4a2828; border-color: var(--red); color: #ffb0b0;
  }
  .phone-display {
    font-size: 0.62rem; color: #636873; text-align: center;
    font-family: "JetBrains Mono", "Consolas", monospace;
    min-width: 100px; line-height: 1.3;
  }
  .phone-display.active { color: var(--accent); }
  .phone-display.error  { color: var(--red); }

</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <h1>B601-RS 控制</h1>
    <div class="header-right">
      <div class="status" id="status">
        <span class="dot"></span> <span id="status-text">连接中…</span>
      </div>
      <button class="btn-reconnect" id="btn-reconnect" title="立即重连 WebSocket">重连</button>
    </div>
  </div>
  <div class="ws-url" id="ws-url">WS: …</div>
  <div class="pose-display" id="pose-display">末端: --</div>

    <div class="log-list" id="log-list"></div>

  <div class="section-label">位置 (m)</div>

  <!-- 摇杆 + Z 按钮 -->
  <div class="joystick-row">
    <div>
      <div class="joystick-pad" id="joystick-pad">
        <div class="joystick-crosshair"></div>
        <div class="joystick-knob" id="joystick-knob"></div>
        <span class="joystick-axis-label x">X</span>
        <span class="joystick-axis-label y">Y</span>
      </div>
      <div class="joystick-pos" id="joystick-pos">X=0.300 Y=0.000</div>
    </div>
    <div class="z-controls">
      <button class="z-btn" id="z-up" title="Z+">▲</button>
      <span class="z-label">Z</span>
      <button class="z-btn" id="z-down" title="Z-">▼</button>
    </div>
    <div class="phone-controls">
      <button class="phone-btn" id="phone-btn" title="开启后:把手机姿态(屏幕朝上=零位)映射到末端角速度,作为速度通道输入">
        <span class="icon">📱</span>Phone
      </button>
      <span class="phone-display" id="phone-display">姿态: 关</span>
    </div>
  </div>

  <div class="slider-group">
    <div class="label-row"><label>X <span class="kbd">Q</span><span class="kbd">A</span></label><span class="val" id="val-x">0.300</span></div>
    <input type="range" id="x" min="-0.20" max="0.60" step="0.001" value="0.300">
  </div>
  <div class="slider-group">
    <div class="label-row"><label>Y <span class="kbd">W</span><span class="kbd">S</span></label><span class="val" id="val-y">0.000</span></div>
    <input type="range" id="y" min="-0.40" max="0.40" step="0.001" value="0.000">
  </div>
  <div class="slider-group">
    <div class="label-row"><label>Z <span class="kbd">E</span><span class="kbd">D</span></label><span class="val" id="val-z">0.200</span></div>
    <input type="range" id="z" min="-0.05" max="0.55" step="0.001" value="0.200">
  </div>

  <div class="reach-status ok" id="reach-status" title="基于 Pinocchio FK 算得的几何常量">
    <span class="reach-msg" id="reach-msg">可达性 · 已加载</span>
    <span class="reach-r" id="reach-r">r=-</span>
  </div>

  <div class="section-label">姿态 (rad)</div>
  <div class="slider-group">
    <div class="label-row"><label>Roll <span class="kbd">R</span><span class="kbd">F</span></label><span class="val" id="val-roll">0.00</span></div>
    <input type="range" id="roll" min="-3.14" max="3.14" step="0.01" value="0.00">
  </div>
  <div class="slider-group">
    <div class="label-row"><label>Pitch <span class="kbd">T</span><span class="kbd">G</span></label><span class="val" id="val-pitch">0.00</span></div>
    <input type="range" id="pitch" min="-3.14" max="3.14" step="0.01" value="0.00">
  </div>
  <div class="slider-group">
    <div class="label-row"><label>Yaw <span class="kbd">Y</span><span class="kbd">H</span></label><span class="val" id="val-yaw">0.00</span></div>
    <input type="range" id="yaw" min="-3.14" max="3.14" step="0.01" value="0.00">
  </div>

    <div class="help-text">
    键盘快捷键调整目标值（拖条高亮），松开后自动发送：
    <br><b>X</b> <span class="kbd">Q</span>/<span class="kbd">A</span> &nbsp;
    <b>Y</b> <span class="kbd">W</span>/<span class="kbd">S</span> &nbsp;
    <b>Z</b> <span class="kbd">E</span>/<span class="kbd">D</span> &nbsp;
    <b>Roll</b> <span class="kbd">R</span>/<span class="kbd">F</span> &nbsp;
    <b>Pitch</b> <span class="kbd">T</span>/<span class="kbd">G</span> &nbsp;
    <b>Yaw</b> <span class="kbd">Y</span>/<span class="kbd">H</span>
  </div>

  <div class="toggle-row">
    <input type="checkbox" id="auto-send" checked>
    <label for="auto-send">拖条时自动发送</label>
  </div>

  <div class="button-row">
    <button class="btn-send" id="btn-send">发送目标</button>
    <button class="btn-home" id="btn-home">归零</button>
  </div>

  <div class="ik-feedback" id="ik-feedback"></div>

</div>

<script>
  const SLIDERS = ["x","y","z","roll","pitch","yaw"];
  // HTTPS 页面下必须用 wss://,否则浏览器因 mixed content 静默拒绝,
  // 表现为 status 永远停在 "连接中"、onopen 永远不触发。
  const WS_PROTO = location.protocol === "https:" ? "wss:" : "ws:";
  const WS_URL = `${WS_PROTO}//${location.host}/ws`;
  // 启动时把 WS URL 写在头部下方,一眼能看到实际连接地址
  document.getElementById("ws-url").textContent = `WS: ${WS_URL}`;
  let ws = null;
  let reconnectTimer = null;
  let reconnectCountdownTimer = null;
  let reconnectAttempts = 0;

  // 状态多态: "connecting" | "connected" | "retrying" (extra=秒数) | "failed" (extra=原因)
  function setStatus(state, extra) {
    const el = document.getElementById("status");
    const text = document.getElementById("status-text");
    el.classList.remove("connected", "retrying", "failed");
    if (reconnectCountdownTimer) {
      clearInterval(reconnectCountdownTimer);
      reconnectCountdownTimer = null;
    }
    if (state === "connected") {
      el.classList.add("connected");
      text.textContent = "已连接";
    } else if (state === "retrying") {
      el.classList.add("retrying");
      const secs = extra != null ? extra : 2;
      text.textContent = `等待重试 ${secs}s (#${reconnectAttempts})`;
      let left = secs;
      reconnectCountdownTimer = setInterval(() => {
        left -= 1;
        if (left <= 0) { clearInterval(reconnectCountdownTimer); reconnectCountdownTimer = null; return; }
        const t = document.getElementById("status-text");
        if (t) t.textContent = `等待重试 ${left}s (#${reconnectAttempts})`;
      }, 1000);
    } else if (state === "failed") {
      el.classList.add("failed");
      text.textContent = extra || "连接失败";
    } else {
      // connecting
      text.textContent = "连接中…";
    }
  }

  function connect() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    setStatus("connecting");
    try {
      ws = new WebSocket(WS_URL);
    } catch (err) {
      appendLog("❌ WebSocket 构造失败: " + err, "err");
      setStatus("failed", `构造失败: ${err}`);
      scheduleReconnect();
      return;
    }
    ws.onopen = () => {
      reconnectAttempts = 0;
      setStatus("connected");
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      console.log("[WS] open", WS_URL);
      appendLog(`✓ WS 已连接 (${WS_URL})`, "ok");
    };
    ws.onerror = (ev) => {
      // Chrome / Android 上 onerror 后通常紧跟 onclose,这里只打日志
      console.warn("[WS] error", WS_URL, "readyState=", ws ? ws.readyState : "?", ev);
      appendLog(`⚠️ WS 错误 (readyState=${ws ? ws.readyState : "?"})`, "warn");
    };
    ws.onclose = (e) => {
      const reason = e && e.code !== undefined
        ? `code=${e.code}` + (e.reason ? ` reason=${e.reason}` : "")
        : "";
      console.warn("[WS] close", WS_URL, reason);
      appendLog(`✗ WS 关闭 ${reason || "(无 reason)"}`, "warn");
      // 持续失败时,在状态栏给一个明显的诊断信息
      if (reconnectAttempts >= 2) {
        const hint = !PHONE_PAGE_IS_SECURE
          ? "可能需要 HTTPS 服务器"
          : (WS_PROTO === "wss:" ? "服务器可能没起 TLS" : "服务器不可达");
        setStatus("failed", `连续失败 (${reason || "code=?"}) · ${hint}`);
      }
      scheduleReconnect();
    };
    ws.onmessage = (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if (msg.type === "feedback") {
          const fb = document.getElementById("ik-feedback");
          fb.textContent = msg.text || "";
          fb.className = "ik-feedback " + (msg.ok ? "ok" : "fail");
        } else if (msg.type === "pose") {
          document.getElementById("pose-display").textContent =
            "末端: pos=[" + msg.pos.join(" ") + "] rpy=[" + msg.rpy.join(" ") + "]";
          // 同步滑块显示
          _serverSync = true;
          if (msg.pos) {
            document.getElementById("x").value = parseFloat(msg.pos[0]);
            document.getElementById("y").value = parseFloat(msg.pos[1]);
            document.getElementById("z").value = parseFloat(msg.pos[2]);
            updateVal("x"); updateVal("y"); updateVal("z");
          }
          if (msg.rpy) {
            document.getElementById("roll").value = parseFloat(msg.rpy[0]);
            document.getElementById("pitch").value = parseFloat(msg.rpy[1]);
            document.getElementById("yaw").value = parseFloat(msg.rpy[2]);
            updateVal("roll"); updateVal("pitch"); updateVal("yaw");
          }
          _serverSync = false;
        } else if (msg.type === "log") {
          appendLog(msg.text, msg.tag || "");
        }
      } catch(e) {}
    };
  }

  // 手动重连 (右上角按钮)
  document.getElementById("btn-reconnect").addEventListener("click", () => {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (reconnectCountdownTimer) { clearInterval(reconnectCountdownTimer); reconnectCountdownTimer = null; }
    if (ws) {
      try { ws.close(); } catch (e) {}
      ws = null;
    }
    reconnectAttempts = 0;
    setStatus("connecting");
    appendLog("🔄 手动重连…", "warn");
    connect();
  });

  // 退避重连 (2s 起步,封顶 10s,带倒计时)
  function scheduleReconnect() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    reconnectAttempts += 1;
    const delay = Math.min(2 * Math.max(1, reconnectAttempts), 10);
    setStatus("retrying", delay);
    reconnectTimer = setTimeout(connect, delay * 1000);
  }

  // ── 日志 (仅保留最新一条) ──
  const LOG_MAX = 6;
  function appendLog(text, tag) {
    // 同步打到 console,移动端通过 chrome://inspect 可以看到
    const tagUp = (tag || "").toUpperCase();
    const fn = tagUp === "ERR" ? console.error : tagUp === "WARN" ? console.warn : console.log;
    fn(`[${tagUp || "LOG"}]`, text);
    const list = document.getElementById("log-list");
    const now = new Date();
    const ts = now.toTimeString().slice(0,8);
    const item = document.createElement("div");
    item.className = "log-list-item" + (tag ? " tag-" + tag : "");
    item.innerHTML = `<span class="ts">${ts}</span><span>${text}</span>`;
    list.appendChild(item);
    // 截断到最近 LOG_MAX 条
    while (list.children.length > LOG_MAX) list.removeChild(list.firstChild);
  }

  // ── 控制 ──
  let _lastSend = 0;
  const THROTTLE_MS = 50;

  function sendTarget(force) {
    const now = Date.now();
    if (!force && now - _lastSend < THROTTLE_MS) return;
    _lastSend = now;
    const vals = {};
    SLIDERS.forEach(id => { vals[id] = parseFloat(document.getElementById(id).value); });
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "target", values: vals }));
    }
  }

  function sendHome() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "home" }));
    }
    SLIDERS.forEach(id => {
      const s = document.getElementById(id);
      const def = {x:0.3,y:0,z:0.2,roll:0,pitch:0,yaw:0};
      if (id in def) { s.value = def[id]; updateVal(id); }
    });
  }

  function updateVal(id) {
    const v = parseFloat(document.getElementById(id).value);
    const prec = (id === "roll" || id === "pitch" || id === "yaw") ? 2 : 3;
    document.getElementById("val-" + id).textContent = v.toFixed(prec);
  }

  // ── 可达性预校验 (基于 Pinocchio FK 算出的 B601-RS 几何常数) ──
  // 默认值与 backend/src/rebot_b601_rs_sim/templates/workspace_constants.json 一致;
  // 若 templates 目录下能找到同名 JSON,会立刻用真值替换。
  const WK = {
    shoulder_xyz:     [0.020, 0.0263, 0.145],
    L_max_m:          0.55,
    L_min_m:          0.07,
    warn_ratio:       0.85,
    dz_floor_m:       -0.10,
    joint_limits_rad: [],
    _loaded:          false,
  };
  fetch("workspace_constants.json")
    .then(r => r.ok ? r.json() : null)
    .then(j => { if (j) { Object.assign(WK, j, {_loaded: true}); _reachRender(); } })
    .catch(() => { /* JSON 缺失时使用兜底默认值 */ });

  function classifyPrecheck(vals) {
    const [sx, sy, sz] = WK.shoulder_xyz;
    const dx = +vals.x - sx, dy = +vals.y - sy, dz = +vals.z - sz;
    const r  = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (dz < WK.dz_floor_m)              return { tier:"fail", r, msg:`z 低于肩部死区` };
    if (r > WK.L_max_m)                  return { tier:"fail", r, msg:`r=${r.toFixed(3)} > L_max=${WK.L_max_m}` };
    if (r < WK.L_min_m)                  return { tier:"fail", r, msg:`r=${r.toFixed(3)} < L_min=${WK.L_min_m}` };
    if (r > WK.warn_ratio * WK.L_max_m)  return { tier:"warn", r, msg:`r=${r.toFixed(3)} 接近边界` };
    return { tier:"ok", r, msg:"可达" };
  }

  function paintSliders(tier) {
    for (const id of ["x","y","z"]) {
      const el = document.getElementById(id);
      if (!el) continue;
      el.classList.remove("ok","warn","fail");
      el.classList.add(tier);
    }
  }

  function _reachRender() {
    const v = Object.fromEntries(SLIDERS.map(i => [i, document.getElementById(i).value]));
    const c = classifyPrecheck(v);
    paintSliders(c.tier);
    const box = document.getElementById("reach-status");
    const tag = document.getElementById("reach-msg");
    const rt  = document.getElementById("reach-r");
    if (box) box.classList.remove("ok","warn","fail"), box.classList.add(c.tier);
    if (tag) tag.textContent = WK._loaded ? `可达性 · ${c.msg}` : `可达性 · 兜底默认 · ${c.msg}`;
    if (rt)  rt.textContent  = `r=${c.r.toFixed(3)} · Lmax=${WK.L_max_m}`;
  }

  // 滑块鼠标拖动 → 发送绝对目标 + 前端可达性预校验
  let _serverSync = false;
  _reachRender();
  SLIDERS.forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener("input", () => {
      updateVal(id);
      if (id === "x" || id === "y" || id === "z") _reachRender();
      // 用户手动拖滑条:主动打断任何速度通道 (摇杆 / Z 按钮),避免两条指令同时驱动机械臂
      if (joyState.active || zBtnState.active) {
        joyState.active = false; joyState.vx = 0; joyState.vy = 0;
        if (zBtnState.active) { zBtnState.active = false; zBtnState.dir = 0; }
        // 只清线速度,角速度通道 (手机) 保持不变 — 与手机姿态可同时驱动末端
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: "velocity",
            vx: 0, vy: 0, vz: 0,
            wx: velState.wx, wy: velState.wy, wz: velState.wz,
          }));
        }
      }
      if (!_serverSync && document.getElementById("auto-send").checked) sendTarget();
    });
  });

  document.getElementById("btn-send").addEventListener("click", () => sendTarget(true));
  document.getElementById("btn-home").addEventListener("click", sendHome);

  // ── 统一增量速率 (units/s) ──
  const RATE = 0.01;
  const JOY_RATE = 0.02;

  // ── 共享状态 ──
  let _rafUpdating = false;
  const joyState = { active: false, vx: 0, vy: 0 };
  const keyState = {};
  const zBtnState = { active: false, dir: 0 };

  // ── 动画驱动循环 (累加器模式) ──
  const _acc = { x:0, y:0, z:0, roll:0, pitch:0, yaw:0 };
  let _lastTick = performance.now();
  function tick(now) {
    const dt = Math.min((now - _lastTick) / 1000, 0.1);
    _lastTick = now;
    _rafUpdating = true;

    // 键盘持续按下 → 累加
    for (const [key, [id, dir]] of Object.entries(KB_MAP)) {
      if (keyState[key]) _acc[id] += dir * RATE * dt;
    }


    // 摇杆已切换到独立的"速度通道",不再写 _acc,以免与拖条/键盘的精确通道混淆

    // Z 按钮已切到独立的"速度通道",不再写 _acc,以保持方案 D 一致性
    // 周期性 heartbeat:重发 vz,防止长按中 WS 漏消息丢失 vz 状态
    if (zBtnState.active) {
      _z_vel_tick = (_z_vel_tick + 1) % 6;   // ~10 Hz @ 60 fps
      if (_z_vel_tick === 0) emitZVelocity();
    } else {
      _z_vel_tick = 0;
    }

    // 所有轴统一应用超步长的累加量
    let changed = false;
    for (const id of ["x","y","z","roll","pitch","yaw"]) {
      const a = _acc[id];
      const el = document.getElementById(id);
      const step = parseFloat(el.step)
      if (Math.abs(a) < step) continue;
      const steps = Math.round(a / step);
      let v = parseFloat(el.value) + steps * step;
      v = Math.min(parseFloat(el.max), Math.max(parseFloat(el.min), v));
      el.value = v;
      _acc[id] -= steps * step;
      updateVal(id);
      changed = true;
    }

    _rafUpdating = false;
    if (changed && document.getElementById("auto-send").checked) sendTarget();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ── 共享速度状态 (6D) ──
  //   vx/vy/vz ← 摇杆 + Z 按钮  (m/s)
  //   wx/wy/wz ← 手机姿态      (rad/s, 由 📱 按钮启用)
  // 每次 emit 都发完整 6 维;后端 OSC 用全 6D 雅可比积分 q_current。
  const velState = { vx: 0, vy: 0, vz: 0, wx: 0, wy: 0, wz: 0 };

  function emitVelState() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({
      type: "velocity",
      vx: velState.vx, vy: velState.vy, vz: velState.vz,
      wx: velState.wx, wy: velState.wy, wz: velState.wz,
    }));
  }

  // ── 摇杆 (X↔Y 对调,只动 vx/vy;同时清 vz,避免与 Z 按钮叠加) ──
  (function initJoystick() {
    const pad = document.getElementById("joystick-pad");
    const knob = document.getElementById("joystick-knob");
    const posDisp = document.getElementById("joystick-pos");
    let dragging = false;

    // 推到 100% 对应的笛卡尔线速度 (m/s),与后端 JOY_LINEAR_SPEED 对齐
    const JOY_VMAX = 0.20;

    function emitVelocity() {
      velState.vx = joyState.vx * JOY_VMAX;
      velState.vy = joyState.vy * JOY_VMAX;
      velState.vz = 0;                  // 摇杆取消 Z 通道 (互斥)
      // wx/wy/wz 保持 — 手机角速度通道与摇杆并行,互不干扰
      emitVelState();
    }

    function resetKnob() {
      knob.style.left = "50%"; knob.style.top = "50%";
      joyState.active = false; joyState.vx = 0; joyState.vy = 0;
      posDisp.textContent = "vx=0.000 m/s  vy=0.000 m/s · 速度通道";
      emitVelocity();                       // 推送 vx=vy=0,后端立即停积分
    }

    function handleEvent(clientX, clientY) {
      const rect = pad.getBoundingClientRect();
      const r = rect.width / 2;
      let cx = clientX - rect.left;
      let cy = clientY - rect.top;
      const dx = cx - r, dy = cy - r;
      const dist = Math.sqrt(dx * dx + dy * dy);
      let ndx, ndy;
      if (dist > r) {
        ndx = dx / dist; ndy = dy / dist;
        cx = ndx * r + r; cy = ndy * r + r;
      } else if (dist < 2) {
        ndx = 0; ndy = 0;
      } else {
        ndx = dx / dist; ndy = dy / dist;
      }
      knob.style.left = cx + "px";
      knob.style.top = cy + "px";

      const fraction = Math.min(dist / r, 1.0);
      joyState.active = true;
      joyState.vx = -ndy * fraction;        // X: 摇杆↑/↓ → 机械臂 +X/-X  (保持原手感)
      joyState.vy = -ndx * fraction;       // Y: 摇杆→/← → 机械臂 -Y/+Y  (反向)
      posDisp.textContent = `vx=${(joyState.vx*JOY_VMAX).toFixed(3)} m/s  vy=${(joyState.vy*JOY_VMAX).toFixed(3)} m/s · 速度通道`;
      emitVelocity();                       // 直接推 WS,不再走 _acc
    }

    pad.addEventListener("mousedown", e => { dragging = true; pad.classList.add("active"); handleEvent(e.clientX, e.clientY); });
    window.addEventListener("mousemove", e => { if (dragging) handleEvent(e.clientX, e.clientY); });
    window.addEventListener("mouseup", () => { dragging = false; pad.classList.remove("active"); resetKnob(); });
    pad.addEventListener("touchstart", e => { e.preventDefault(); dragging = true; pad.classList.add("active"); const t = e.touches[0]; handleEvent(t.clientX, t.clientY); });
    window.addEventListener("touchmove", e => { if (dragging) { const t = e.touches[0]; handleEvent(t.clientX, t.clientY); } });
    window.addEventListener("touchend", () => { dragging = false; pad.classList.remove("active"); resetKnob(); });
    resetKnob();
  })();

  // ── Z 按钮: 走速度通道 (与摇杆共用 type=velocity 消息) ──
  // 长按期间发 vz ≠ 0,松开发 vz = 0,后端 OSC 块直接积分 — 与方案 D 一致。
  // 同时兼容键盘 E/D: KB_MAP 中 e/d 对应 z,那部分走 _acc 累加 + 滑条;若用户
    // 已经按了 Z 按钮,滑条 input 监听器会顺手把 vz 也置 0 (见 SLIDERS.forEach)。
  const VZ_MAX = 0.12;                  // m/s,Z 按钮推满对应线速度
  let _z_vel_tick = 0;                  // heartbeat 计时器 (见 tick())

  function emitZVelocity() {
    // 注意:同时把 vx/vy 也置 0,这样 Z 按钮按下时与摇杆不会在 OSC 处叠加
    //       wx/wy/wz 保持 — 允许 Z 移动 + 手机角速度旋转同时进行
    velState.vz = zBtnState.active ? zBtnState.dir * VZ_MAX : 0.0;
    velState.vx = 0;
    velState.vy = 0;
    emitVelState();
  }

  (function initZButtons() {
    const zUp = document.getElementById("z-up");
    const zDown = document.getElementById("z-down");

    zUp.addEventListener("mousedown", e => {
      e.preventDefault();
      zBtnState.active = true;
      zBtnState.dir = 1;
      emitZVelocity();                    // 立即推 vz = +VZ_MAX
    });
    zDown.addEventListener("mousedown", e => {
      e.preventDefault();
      zBtnState.active = true;
      zBtnState.dir = -1;
      emitZVelocity();                    // 立即推 vz = -VZ_MAX
    });

    // 松开时停止 (window 级, 防止鼠标移出按钮时丢事件)
    window.addEventListener("mouseup", () => {
      if (zBtnState.active) {
        zBtnState.active = false;
        emitZVelocity();                  // 推 vz = 0
      }
    });

    // touch 端 (移动端):同样处理
    zUp.addEventListener("touchstart", e => { e.preventDefault(); zBtnState.active = true; zBtnState.dir = 1; emitZVelocity(); });
    zDown.addEventListener("touchstart", e => { e.preventDefault(); zBtnState.active = true; zBtnState.dir = -1; emitZVelocity(); });
    const _zRelease = () => { if (zBtnState.active) { zBtnState.active = false; emitZVelocity(); } };
    zUp.addEventListener("touchend", _zRelease);
    zDown.addEventListener("touchend", _zRelease);
    zUp.addEventListener("touchcancel", _zRelease);
    zDown.addEventListener("touchcancel", _zRelease);
  })();

  // ── 手机姿态 (速度通道 → 末端角速度 wx/wy/wz) ──
  // 单一路径: WebXR inline session (Android Chrome / Edge / Samsung Internet)。
  // 屏幕朝上 (任意方向) 在按钮按下瞬间被快照为零位,倾角 → 角速度 (线性 + 截断到 45°)。
  const PHONE_ANG_MAX  = 0.50;                              // rad/s,与后端 PHONE_ANG_SPEED 对齐
  const PHONE_TILT_FULL = Math.PI / 4;                       // rad (45°), 满倾角
  const PHONE_W_GAIN    = PHONE_ANG_MAX / PHONE_TILT_FULL;   // rad/s per rad
  const PHONE_SIGNAL_TIMEOUT_MS = 1500;                      // "无信号" 看门狗时长

  const phoneState = {
    active: false,                 // 按钮是否启用
    ref: null,                     // 屏幕朝上零位快照 (euler rad: {roll, pitch, yaw})
    wx: 0, wy: 0, wz: 0,           // 当前推算的角速度 (rad/s)
    hasSignal: false,              // 启用后是否拿到过有效 XR pose
    signalTimer: null,             // 看门狗 setTimeout id
    xrSession: null,               // 当前 WebXR XRSession
    xrRefSpace: null,              // XRReferenceSpace (local)
  };

  // WebXR 要求安全上下文 (HTTPS 或 localhost)。
  const PHONE_PAGE_IS_SECURE =
    location.protocol === "https:" ||
    location.hostname === "localhost" ||
    location.hostname === "127.0.0.1" ||
    /^10\./.test(location.hostname)            ||
    /^192\.168\./.test(location.hostname)      ||
    /^172\.(1[6-9]|2\d|3[01])\./.test(location.hostname);

  function phoneWebXRSupported() {
    return typeof navigator !== "undefined"
        && !!navigator.xr
        && typeof navigator.xr.isSessionSupported === "function";
  }

  // quaternion (x, y, z, w) → euler (roll, pitch, yaw) (ZYX intrinsic, rad)
  function phoneQuatToEuler(qx, qy, qz, qw) {
    const sinr_cosp = 2 * (qw * qx + qy * qz);
    const cosr_cosp = 1 - 2 * (qx * qx + qy * qy);
    const roll  = Math.atan2(sinr_cosp, cosr_cosp);

    const sinp = 2 * (qw * qy - qz * qx);
    const pitch = Math.abs(sinp) >= 1
      ? Math.sign(sinp) * Math.PI / 2
      : Math.asin(sinp);

    const siny_cosp = 2 * (qw * qz + qx * qy);
    const cosy_cosp = 1 - 2 * (qy * qy + qz * qz);
    const yaw   = Math.atan2(siny_cosp, cosy_cosp);

    return { roll, pitch, yaw };
  }

  function phoneClampTilt(x) {
    return Math.max(-PHONE_TILT_FULL, Math.min(PHONE_TILT_FULL, x));
  }

  function phoneSetDisplay(text, mode /* "active" | "error" | null */) {
    const disp = document.getElementById("phone-display");
    disp.classList.remove("active", "error");
    if (mode) disp.classList.add(mode);
    disp.textContent = text;
  }

  // 把 (roll/pitch/yaw) deltas 映射到 velState 并显示
  function phoneApplyDeltas(dRoll, dPitch, dYaw) {
    // 符号约定 (手感不对时,翻转相应符号即可):
    //   wx (pitch) ← -dPitch  俯仰
    //   wy (roll)  ← +dRoll   翻滚
    //   wz (yaw)   ← -dYaw    偏航
    phoneState.wx = -phoneClampTilt(dPitch) * PHONE_W_GAIN;
    phoneState.wy =  phoneClampTilt(dRoll)  * PHONE_W_GAIN;
    phoneState.wz = -phoneClampTilt(dYaw)   * PHONE_W_GAIN;
    velState.wx = phoneState.wx;
    velState.wy = phoneState.wy;
    velState.wz = phoneState.wz;
    emitVelState();
    const f = (v) => (v * 180 / Math.PI).toFixed(0).padStart(3, " ");
    phoneSetDisplay(
      `P=${f(dPitch)}° R=${f(dRoll)}° Y=${f(dYaw)}° · ω_max=${PHONE_ANG_MAX.toFixed(2)}`,
      "active",
    );
  }

  function phoneMarkSignal() {
    if (!phoneState.hasSignal) {
      phoneState.hasSignal = true;
      phoneClearSignalWatchdog();
    }
  }

  // "无信号" 看门狗 — 启用按钮 1.5s 后仍无 XR pose → 提示用户
  function phoneStartSignalWatchdog() {
    phoneClearSignalWatchdog();
    phoneState.signalTimer = setTimeout(() => {
      if (!phoneState.active) return;
      if (phoneState.hasSignal) return;
      const hint = PHONE_PAGE_IS_SECURE
        ? "无信号 (WebXR 追踪丢失?)"
        : "无信号 (需 HTTPS)";
      phoneSetDisplay(`姿态: ${hint}`, "error");
      appendLog(`⚠️ 启用后 ${PHONE_SIGNAL_TIMEOUT_MS}ms 未收到 XR pose,${hint}`, "warn");
    }, PHONE_SIGNAL_TIMEOUT_MS);
  }

  function phoneClearSignalWatchdog() {
    if (phoneState.signalTimer != null) {
      clearTimeout(phoneState.signalTimer);
      phoneState.signalTimer = null;
    }
  }

  // ── WebXR session 建立 ────────────────────────────────────────────────
  async function phoneStartWebXR() {
    if (!phoneWebXRSupported()) {
      return { ok: false, reason: "no-webxr-api" };
    }
    let session = null;
    let mode = null;
    try {
      if (await navigator.xr.isSessionSupported("inline")) {
        session = await navigator.xr.requestSession("inline");
        mode = "inline";
      } else if (await navigator.xr.isSessionSupported("immersive-ar")) {
        session = await navigator.xr.requestSession("immersive-ar", {
          requiredFeatures: ["local"],
        });
        mode = "immersive-ar";
      } else {
        return { ok: false, reason: "no-mode" };
      }
    } catch (err) {
      appendLog("❌ WebXR requestSession 失败: " + err, "err");
      return { ok: false, reason: "request-failed" };
    }

    let refSpace;
    try {
      refSpace = await session.requestReferenceSpace("local");
    } catch (err) {
      appendLog("❌ WebXR requestReferenceSpace 失败: " + err, "err");
      try { session.end(); } catch (e) {}
      return { ok: false, reason: "refspace-failed" };
    }

    phoneState.xrSession  = session;
    phoneState.xrRefSpace = refSpace;
    appendLog(`✓ WebXR ${mode} session 已建立`, "ok");

    // 监听 session 外部结束 (浏览器后台 / 用户按停止)
    session.addEventListener("end", () => {
      appendLog("⚠️ WebXR session 已结束", "warn");
      if (phoneState.active) {
        phoneStop(/* silent */ true);
      }
    });

    // XR 帧循环 — pose 每帧可能 null (追踪丢失)
    function onXRFrame(time, frame) {
      if (!phoneState.active || !phoneState.xrSession) return;
      const pose = frame.getViewerPose(phoneState.xrRefSpace);
      if (pose) {
        const t = pose.transform;
        if (t && t.orientation) {
          const o = t.orientation;
          const { roll, pitch, yaw } = phoneQuatToEuler(o.x, o.y, o.z, o.w);
          phoneMarkSignal();
          if (!phoneState.ref) {
            phoneState.ref = { roll, pitch, yaw };
            phoneSetDisplay(
              `P=  0° R=  0° Y=  0° · ω_max=${PHONE_ANG_MAX.toFixed(2)}rad/s`,
              "active",
            );
          } else {
            const ref = phoneState.ref;
            let dYaw = yaw - ref.yaw;
            dYaw = ((dYaw + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
            phoneApplyDeltas(roll - ref.roll, pitch - ref.pitch, dYaw);
          }
        }
      }
      try { phoneState.xrSession.requestAnimationFrame(onXRFrame); }
      catch (e) { /* session 已被 end,忽略 */ }
    }
    session.requestAnimationFrame(onXRFrame);
    return { ok: true };
  }

  // ── 关闭 / 清理 ───────────────────────────────────────────────────────
  function phoneStop(silent) {
    phoneClearSignalWatchdog();
    phoneState.active    = false;
    phoneState.ref       = null;
    phoneState.hasSignal = false;
    phoneState.wx = phoneState.wy = phoneState.wz = 0;
    velState.wx = velState.wy = velState.wz = 0;

    if (phoneState.xrSession) {
      try { phoneState.xrSession.end(); } catch (e) {}
    }
    phoneState.xrSession  = null;
    phoneState.xrRefSpace = null;

    const btn  = document.getElementById("phone-btn");
    const disp = document.getElementById("phone-display");
    btn.classList.remove("active", "error");
    disp.classList.remove("active", "error");
    disp.textContent = "姿态: 关";
    emitVelState();
    if (!silent) appendLog("📱 手机姿态通道已关闭", "warn");
  }

  // ── 主开关 ────────────────────────────────────────────────────────────
  async function togglePhone() {
    if (phoneState.active) {
      phoneStop(false);
      return;
    }
    if (!PHONE_PAGE_IS_SECURE) {
      appendLog("⚠️ 当前页面不是 HTTPS,WebXR 在 Android 上无法工作", "warn");
    }
    if (!phoneWebXRSupported()) {
      phoneSetDisplay("姿态: 不支持", "error");
      document.getElementById("phone-btn").classList.add("error");
      appendLog("❌ 当前浏览器不支持 WebXR (navigator.xr 缺失)", "err");
      return;
    }

    const result = await phoneStartWebXR();
    if (!result.ok) {
      phoneSetDisplay(`姿态: 启动失败 (${result.reason})`, "error");
      document.getElementById("phone-btn").classList.add("error");
      appendLog(`❌ WebXR 启动失败: ${result.reason}`, "err");
      return;
    }

    // 进入激活态 — 第一次 XR pose 到来时 ref 才被设定
    phoneState.active    = true;
    phoneState.hasSignal = false;
    phoneState.ref       = null;

    const btn = document.getElementById("phone-btn");
    btn.classList.add("active");
    btn.classList.remove("error");
    phoneSetDisplay("姿态: 校准中…", "active");
    phoneStartSignalWatchdog();
    appendLog("📱 姿态通道已启用 (WebXR),请保持屏幕朝上后倾斜手机控制末端", "ok");
  }

  document.getElementById("phone-btn").addEventListener("click", togglePhone);
</script>
</body>
</html>
